
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CINEHUB - Website xem phim</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #090d18;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #121a2b;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: orange;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 12px;
}

nav a:hover {
    color: orange;
}

.search {
    padding: 10px;
    border-radius: 20px;
    border: none;
}

.hero {
    padding: 70px 30px;
    min-height: 300px;
    background: linear-gradient(90deg, #080d18, #202c49);
}

.hero h1 {
    font-size: 45px;
    margin-bottom: 15px;
}

.hero p {
    color: #ccc;
    line-height: 1.6;
}

button {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: orange;
    font-weight: bold;
    margin-top: 15px;
}

button:hover {
    background: white;
}

main {
    padding: 30px;
}

h2 {
    margin: 20px 0;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 25px;
}

.filters button {
    margin: 0;
    background: #26344e;
    color: white;
}

.filters button.active,
.filters button:hover {
    background: orange;
    color: black;
}

.movie-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.movie {
    background: #121a2b;
    border-radius: 15px;
    overflow: hidden;
    transition: 0.3s;
}

.movie:hover {
    transform: translateY(-7px);
}

.movie img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    background: #26344e;
}

.movie-info {
    padding: 15px;
}

.movie-info h3 {
    margin-bottom: 10px;
}

.movie-info p {
    color: #aaa;
    font-size: 13px;
    margin: 8px 0;
}

.heart {
    background: #26344e;
    color: white;
    margin-right: 5px;
}

.heart.saved {
    color: #ff6d86;
}

a.trailer {
    display: inline-block;
    background: orange;
    color: black;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 13px;
    margin-top: 8px;
}

.empty {
    color: #aaa;
    padding: 20px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #999;
}

@media(max-width: 900px) {
    .movie-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media(max-width: 600px) {
    .movie-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .hero h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">CINEHUB</div>

    <nav>
        <a href="#home">Trang chủ</a>
        <a href="#movies">Danh sách phim</a>
        <a href="#favorites">Yêu thích</a>
    </nav>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="Tìm kiếm phim..."
    >
</header>

<section class="hero" id="home">
    <h1>THẾ GIỚI PHIM HAY</h1>

    <p>
        Khám phá những bộ phim hấp dẫn,
        từ hành động, tình cảm đến hoạt hình.
    </p>

    <a href="#movies">
        <button>Khám phá ngay</button>
    </a>
</section>

<main>

    <h2 id="movies">🎬 DANH SÁCH PHIM</h2>

    <div class="filters">
        <button class="active" data-category="Tất cả">Tất cả</button>
        <button data-category="Hành động">Hành động</button>
        <button data-category="Tình cảm">Tình cảm</button>
        <button data-category="Hoạt hình">Hoạt hình</button>
        <button data-category="Khoa học viễn tưởng">
            Khoa học viễn tưởng
        </button>
        <button data-category="Phiêu lưu">Phiêu lưu</button>
    </div>

    <div class="movie-grid" id="movie-list"></div>

    <p class="empty" id="empty" hidden>
        Không tìm thấy phim phù hợp.
    </p>

    <h2 id="favorites">❤️ PHIM YÊU THÍCH</h2>

    <div class="movie-grid" id="favorite-list"></div>

</main>

<footer>
    CINEHUB © 2026 - Chúc bạn xem phim vui vẻ!
</footer>

<script>
const movies = [
    {
        id: 1,
        title: "Inception",
        year: 2010,
        genre: "Khoa học viễn tưởng",
        rating: "8.8",
        image: "https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg"
    },
    {
        id: 2,
        title: "Interstellar",
        year: 2014,
        genre: "Khoa học viễn tưởng",
        rating: "8.7",
        image: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MdfZJ5G.jpg"
    },
    {
        id: 3,
        title: "Spider-Man: Into the Spider-Verse",
        year: 2018,
        genre: "Hoạt hình",
        rating: "8.4",
        image: "https://image.tmdb.org/t/p/w500/iiZZdoQBEYBv6id8su7ImL0oCbD.jpg"
    },
    {
        id: 4,
        title: "Your Name",
        year: 2016,
        genre: "Tình cảm",
        rating: "8.4",
        image: "https://image.tmdb.org/t/p/w500/q719jXXEzOoYaps6apY1wX9.jpg"
    },
    {
        id: 5,
        title: "The Dark Knight",
        year: 2008,
        genre: "Hành động",
        rating: "9.0",
        image: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg"
    },
    {
        id: 6,
        title: "Coco",
        year: 2017,
        genre: "Hoạt hình",
        rating: "8.4",
        image: "https://image.tmdb.org/t/p/w500/gGEsBPA7S5Vv9Q9f4p5p7L5c.jpg"
    },
    {
        id: 7,
        title: "Mad Max: Fury Road",
        year: 2015,
        genre: "Hành động",
        rating: "8.1",
        image: "https://image.tmdb.org/t/p/w500/8tZYtuWe.jpg"
    },
    {
        id: 8,
        title: "The Lord of the Rings",
        year: 2001,
        genre: "Phiêu lưu",
        rating: "8.9",
        image: "https://image.tmdb.org/t/p/w500/6oom5QYQ2yQTMJIbnvbkBL9cHo6.jpg"
    }
];

let category = "Tất cả";
let searchText = "";

let favorites = JSON.parse(
    localStorage.getItem("cinehub-favorites") || "[]"
);

function createMovie(movie) {
    const isFavorite = favorites.includes(movie.id);

    return `
        <div class="movie">

            <img src="${movie.image}"
                 alt="${movie.title}"
                 onerror="this.style.opacity='0.2'">

            <div class="movie-info">

                <h3>${movie.title}</h3>

                <p>
                    ${movie.year} |
                    ${movie.genre}
                </p>

                <p>⭐ Đánh giá: ${movie.rating}/10</p>

                <button
                    class="heart ${isFavorite ? "saved" : ""}"
                    onclick="toggleFavorite(${movie.id})">
                    ${isFavorite ? "♥ Đã thích" : "♡ Yêu thích"}
                </button>

                <a class="trailer"
                   target="_blank"
                   rel="noopener"
                   href="https://www.youtube.com/results?search_query=${encodeURIComponent(movie.title + " trailer")}">
                    Xem trailer
                </a>

            </div>
        </div>
    `;
}

function renderMovies() {
    const filtered = movies.filter(movie => {
        const matchCategory =
            category === "Tất cả" ||
            movie.genre === category;

        const matchSearch =
            movie.title.toLowerCase().includes(
                searchText.toLowerCase()
            ) ||
            movie.genre.toLowerCase().includes(
                searchText.toLowerCase()
            );

        return matchCategory && matchSearch;
    });

    document.getElementById("movie-list").innerHTML =
        filtered.map(createMovie).join("");

    document.getElementById("empty").hidden =
        filtered.length > 0;

    const favoriteMovies = movies.filter(movie =>
        favorites.includes(movie.id)
    );

    document.getElementById("favorite-list").innerHTML =
        favoriteMovies.length
        ? favoriteMovies.map(createMovie).join("")
        : "<p class='empty'>Bạn chưa có phim yêu thích.</p>";
}

function toggleFavorite(id) {
    if (favorites.includes(id)) {
        favorites = favorites.filter(item => item !== id);
    } else {
        favorites.push(id);
    }

    localStorage.setItem(
        "cinehub-favorites",
        JSON.stringify(favorites)
    );

    renderMovies();
}

document.getElementById("search").addEventListener(
    "input",
    function() {
        searchText = this.value;
        renderMovies();
    }
);

document.querySelectorAll(".filters button").forEach(button => {
    button.addEventListener("click", function() {
        category = this.dataset.category;

        document.querySelectorAll(".filters button")
            .forEach(item => item.classList.remove("active"));

        this.classList.add("active");

        renderMovies();
    });
});

renderMovies();
</script>

</body>
</html>
